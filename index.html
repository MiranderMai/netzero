<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <script>
        const canvas = document.getElementById('gameCanvas');

        function initializeCarbonSinks() {

        let player = { x: 1.5, y: 1.5, speedX: 0, speedY: 0, speed: 0.12 };

        function isWall(x, y) {
            const gridX = Math.floor(x);
            const gridY = Math.floor(y);
            if (gridX < 0 || gridX >= COLS || gridY < 0 || gridY >= ROWS) return true;
            return maze[gridY][gridX] === 1;
        }

        function spawnNewEnemy() {
            let newX, newY;
            let attempts = 0;
            const maxAttempts = 200;
            do {
                newX = Math.floor(Math.random() * COLS);
                newY = Math.floor(Math.random() * ROWS);
                attempts++;
                if (attempts > maxAttempts) {
                    console.warn('無法找到適合的新敵人位置，嘗試次數:', attempts);
                    return false;
                }
            } while (
                maze[newY][newX] !== 0 ||
                (Math.abs(newX - player.x) < 1 && Math.abs(newY - player.y) < 1) ||
                greenhouseGases.some(gas => Math.abs(gas.x - newX) < 0.5 && Math.abs(gas.y - newY) < 0.5)
            );
            greenhouseGases.push({ x: newX, y: newY, type: 'chase' });
            console.log('新增敵人成功，位置:', newX, newY, '總數:', greenhouseGases.length);
            return true;
        }

        function aStar(start, goal) {
            try {
                const openSet = [{ x: start.x, y: start.y, g: 0, h: heuristic(start, goal), f: 0, parent: null }];
                const closedSet = new Set();
                while (openSet.length > 0) {
                    openSet.sort((a, b) => a.f - b.f);
                    const current = openSet.shift();
                    const key = `${current.x},${current.y}`;
                    if (current.x === goal.x && current.y === goal.y) {
                        const path = [];
                        let node = current;
                        while (node) {
                            path.push({ x: node.x, y: node.y });
                            node = node.parent;
                        }
                        return path.reverse();
                    }
                    closedSet.add(key);
                    const neighbors = [
                        { x: current.x + 1, y: current.y },
                        { x: current.x - 1, y: current.y },
                        { x: current.x, y: current.y + 1 },
                        { x: current.x, y: current.y - 1 }
                    ];
                    for (const neighbor of neighbors) {
                        if (neighbor.x < 0 || neighbor.x >= COLS || neighbor.y < 0 || neighbor.y >= ROWS || maze[neighbor.y][neighbor.x] === 1) continue;
                        const neighborKey = `${neighbor.x},${neighbor.y}`;
                        if (closedSet.has(neighborKey)) continue;
                        const g = current.g + 1;
                        const h = heuristic(neighbor, goal);
                        const f = g + h;
                        let existing = openSet.find(n => n.x === neighbor.x && n.y === neighbor.y);
                        if (!existing) {
                            openSet.push({ x: neighbor.x, y: neighbor.y, g, h, f, parent: current });
                        } else if (g < existing.g) {
                            existing.g = g;
                            existing.f = f;
                            existing.parent = current;
                        }
                    }
                }
                return [];
            } catch (e) {
                console.error('A*路徑尋找失敗:', e);
                return [];
            }

        function heuristic(a, b) {

        function update() {
            if (gameOver) return;
            try {
                frameCount++;
                carbonSinkPulse += 0.05;

                const oldX = player.x;

                let newX = player.x + player.speedX;
                let newY = player.y + player.speedY;
                const playerRadius = 0.2;
                let canMove = true;
                const corners = [
                    { x: newX - playerRadius, y: newY - playerRadius },
                    { x: newX + playerRadius, y: newY - playerRadius },
                    { x: newX - playerRadius, y: newY + playerRadius },
                    { x: newX + playerRadius, y: newY + playerRadius }
                ];
                for (const corner of corners) {
                    if (isWall(corner.x, corner.y)) {
                        canMove = false;
                        break;
                    }
                }
                if (canMove) {
                    player.x = newX;
                    player.y = newY;

                    const gridX = Math.floor(player.x);
                    const gridY = Math.floor(player.y);
                    const centerX = gridX + 0.5;
                    const centerY = gridY + 0.5;
                    if (Math.abs(player.x - centerX) < 0.05) player.x = centerX;
                    if (Math.abs(player.y - centerY) < 0.05) player.y = centerY;

                    const checkCells = [
                        { x: gridX, y: gridY },
                        { x: gridX + 1, y: gridY },
                        { x: gridX - 1, y: gridY },
                        { x: gridX, y: gridY + 1 },
                        { x: gridX, y: gridY - 1 }
                    ];
                    for (const cell of checkCells) {
                        const cx = cell.x;
                        const cy = cell.y;
                        if (
                            cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS &&
                            maze[cy][cx] === 2
                        ) {
                            const centerX = cx + 0.5;
                            const centerY = cy + 0.5;
                            const distX = Math.abs(player.x - centerX);
                            const distY = Math.abs(player.y - centerY);
                            const passedX = (oldX <= centerX && player.x >= centerX) || (oldX >= centerX && player.x <= centerX);
                            const passedY = (oldY <= centerY && player.y >= centerY) || (oldY >= centerY && player.y <= centerY);
                            if (
                                (distX < 0.3 && distY < 0.3) ||
                                (passedX && distY < 0.3) ||
                                (passedY && distX < 0.3)
                            ) {
                                maze[cy][cx] = 0;
                                carbonScore -= 5;

                                console.log('吃到碳匯，分數:', carbonScore);
                                if (lastEnemyReductionScore - carbonScore >= 50 && greenhouseGases.length > 0) {
                                    let indexToRemove = greenhouseGases.length - 1;
                                    greenhouseGases.splice(indexToRemove, 1);
                                    lastEnemyReductionScore -= 50;
                                    console.log('敵人減少，剩餘:', greenhouseGases.length);
                                }
                                break;
                            }
                        }
                    }
                }

                greenhouseGases.forEach((gas) => {
                    let speed = carbonScore <= 150 ? 0.2 : 0.1;
                    if (frameCount % 90 === 0) {
                        const path = aStar(gas, { x: Math.floor(player.x), y: Math.floor(player.y) });
                        if (path.length > 1) {
                            gas.x = path[1].x;
                            gas.y = path[1].y;
                        }
                    }
                });

                if (collisionCooldown === 0) {
                    for (let i = 0; i < greenhouseGases.length; i++) {
                        const gas = greenhouseGases[i];
                        if (Math.abs(player.x - gas.x) < 0.8 && Math.abs(player.y - gas.y) < 0.8) {
                            carbonScore += 50;
                            if (spawnNewEnemy()) {
                                addCarbonSinks(10);
                                collisionCooldown = 30;
                            }
                            console.log('碰到敵人，分數增加 50，總分:', carbonScore, '敵人數量:', greenhouseGases.length);
                            break;
                        }
                    }
                }

                if (greenhouseGases.length >= 10) {
                    gameOver = true;
                    gameResult = 'failure';
                    console.log('敵人數量達 10，遊戲結束：失敗，分數:', carbonScore);
                }

                infoDiv.textContent = `碳排放量: ${carbonScore} | 溫室氣體數量: ${greenhouseGases.length}`;

                let carbonSinksLeft = maze.some(row => row.includes(2));
                if (!carbonSinksLeft || carbonScore === 0) {
                    gameOver = true;
                    gameResult = 'success';
                    console.log('遊戲結束：成功，分數:', carbonScore, '碳匯剩餘:', carbonSinksLeft);
                }
            } catch (e) {
                console.error('更新遊戲狀態失敗:', e);
                gameOver = true;
                gameResult = 'failure';
            }
        }

        function draw() {

                for (let y = 0; y < ROWS; y++) {

                                ctx.fill();

                        }
                    }
                }

                if (!imagesFailed && playerImg.complete) {

                }

                greenhouseGases.forEach((gas, index) => {
                    if (!imagesFailed && co2Img.complete) {
                        const floatOffset = 2 * Math.sin(frameCount * 0.05 + index);
                        ctx.drawImage(
                            co2Img,
                            gas.x * CELL_SIZE,
                            gas.y * CELL_SIZE + floatOffset,
                            CELL_SIZE,
                            CELL_SIZE
                        );
                    } else {
                        ctx.fillStyle = 'black';
                        ctx.beginPath();
                        ctx.arc(
                            gas.x * CELL_SIZE + CELL_SIZE / 2,
                            gas.y * CELL_SIZE + CELL_SIZE / 2,
                            CELL_SIZE / 2,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                    }
                });

                if (gameOver) {
                    drawGameOver();
                }
            } catch (e) {
                console.error('繪製遊戲畫面失敗:', e);
            }
        }

        function gameLoop() {
            try {
                update();
                draw();
                if (!gameOver) {
                    requestAnimationFrame(gameLoop);
                }
            } catch (e) {
                console.error('遊戲迴圈失敗:', e);
                gameOver = true;
                gameResult = 'failure';
                drawGameOver();
            }
        }

        if (imagesLoaded !== 3 && !imagesFailed) {
            console.log('等待圖片載入...');
        }
    </script>
</body>
</html>
